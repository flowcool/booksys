name: Recover v0.1.0 publication

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: release-images
  cancel-in-progress: false

jobs:
  qualify:
    if: github.repository == 'flowcool/booksys' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Require space for the retained artifact and both source parts
        run: |
          python3 - <<'PY'
          import os,shutil
          free=shutil.disk_usage(os.environ['RUNNER_TEMP']).free
          required=8528899963+3571784330+1024**3
          print({'free_bytes':free,'required_bytes':required})
          if free < required:
              raise SystemExit('Insufficient disk space; preserve proof and stop')
          PY
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          artifact-ids: '13924175975'
          run-id: '43171690522'
          github-token: ${{ secrets.GITHUB_TOKEN }}
          merge-multiple: true
          path: ${{ runner.temp }}/original
      - name: Revalidate original bytes and split only the retained source archive
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 ops/recover_first_release.py prepare "$RUNNER_TEMP/original" "$RUNNER_TEMP/recovery"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: qualified-multipart-recovery
          path: ${{ runner.temp }}/recovery/
          compression-level: 0
          retention-days: 30
          if-no-files-found: error
  publish:
    needs: qualify
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: write
      actions: read
      packages: write
      id-token: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: qualified-multipart-recovery
          path: ${{ runner.temp }}/recovery
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4
        with:
          cosign-release: v3.1.4
      - name: Install the existing pinned copier and assert certificate SHA verification support
        run: |
          bash ops/install_release_tools.sh "$RUNNER_TEMP/release-tools"
          echo "$RUNNER_TEMP/release-tools" >> "$GITHUB_PATH"
          echo "REGISTRY_AUTH_FILE=$RUNNER_TEMP/docker/config.json" >> "$GITHUB_ENV"
          echo "DOCKER_CONFIG=$RUNNER_TEMP/docker" >> "$GITHUB_ENV"
          cosign verify --help | grep -- --certificate-github-workflow-sha
      - name: Authenticate only the publisher
        env:
          REGISTRY_USER: ${{ github.actor }}
        run: |
          mkdir -p "$DOCKER_CONFIG"
          printf '%s' "$GH_TOKEN" | skopeo login --username "$REGISTRY_USER" --password-stdin ghcr.io
      - name: Publish retained graphs and source parts, sign and read back
        run: python3 ops/recover_first_release.py publish "$RUNNER_TEMP/recovery" "$RUNNER_TEMP/release-journal.json"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: ${{ always() }}
        with:
          name: multipart-publication-proof
          path: |
            ${{ runner.temp }}/release-journal.json
            ${{ runner.temp }}/recovery/plan.json
            ${{ runner.temp }}/recovery/sources/manifest.json
            ${{ runner.temp }}/recovery/release-notes.md
            ${{ runner.temp }}/recovery/artifacts/*/*.readback.oci.tar
          compression-level: 0
          retention-days: 90
          if-no-files-found: warn
