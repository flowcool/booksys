name: Validate image artifact

on:
  workflow_call:
    inputs:
      image:
        required: true
        type: string
      dockerfile:
        required: true
        type: string

permissions:
  contents: read

jobs:
  image:
    name: image (${{ inputs.image }})
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install declared validation prerequisites
        run: |
          bash ops/install_validation_tools.sh "$RUNNER_TEMP/validation-tools"
          echo "$RUNNER_TEMP/validation-tools" >> "$GITHUB_PATH"
      - uses: docker/setup-docker-action@e43656e248c0bd0647d3f5c195d116aacf6fcaf4 # v4
        with:
          version: v29.9.0
          daemon-config: '{"features":{"containerd-snapshotter":true}}'
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
        with:
          version: v0.38.0
          driver-opts: image=moby/buildkit@sha256:c5f8862f52499773af85bc07695b2379ef08e8002352b0df2c4864c91d78dabe
      - name: Build the retained artifact without publication
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: ${{ inputs.dockerfile }}
          platforms: linux/amd64
          push: false
          pull: true
          outputs: type=oci,dest=${{ runner.temp }}/image.oci.tar
          labels: |
            org.opencontainers.image.source=https://github.com/flowcool/booksys
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=${{ inputs.image }}-amd64
          cache-to: type=gha,scope=${{ inputs.image }}-amd64,mode=max
          no-cache: ${{ github.event_name == 'schedule' }}
      - name: Run isolated probe and exact-artifact security gates
        env:
          IMAGE: ${{ inputs.image }}
        run: bash ops/validate_image.sh "$IMAGE" "$RUNNER_TEMP/image.oci.tar" "$GITHUB_SHA" "$RUNNER_TEMP/image-proof"
      - name: Retain reports even when the gate fails
        if: ${{ always() }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: image-proof-${{ inputs.image }}
          path: ${{ runner.temp }}/image-proof/
          if-no-files-found: error
          retention-days: 14
