name: Validate

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "23 4 * * 1"

permissions:
  contents: read

concurrency:
  group: validate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  scope:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      worker: ${{ steps.scope.outputs.worker }}
      library: ${{ steps.scope.outputs.library }}
      byparr: ${{ steps.scope.outputs.byparr }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: python3 ops/ci_scope.py "$EVENT_NAME" "$GITHUB_EVENT_PATH" "$GITHUB_OUTPUT"
  policy:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate workflow syntax and security
        run: |
          bash ops/install_validation_tools.sh "$RUNNER_TEMP/validation-tools"
          "$RUNNER_TEMP/validation-tools/actionlint"
          "$RUNNER_TEMP/validation-tools/zizmor" --offline --no-progress .github/workflows/
      - name: Check scope decisions with isolated Git histories
        run: python3 -m unittest discover -s tests -p test_ci_scope.py -v
      - name: Validate generic Compose examples
        run: docker compose -f compose.ghcr.example.yaml config --quiet
  offline-tests:
    needs: scope
    if: needs.scope.outputs.worker == 'true' || needs.scope.outputs.library == 'true' || needs.scope.outputs.byparr == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:18.6-bookworm@sha256:f1ea2a1a4fb7b68d4836be1fdcb8a6466a89b072158bf9d97663600538c294c5
        env:
          POSTGRES_DB: booksys_ci
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d booksys_ci"
          --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          version: "0.11.33"
          python-version: "3.14"
          enable-cache: true
          cache-suffix: offline-tests
      - name: Install required native and JavaScript test tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends bubblewrap unrar tesseract-ocr tesseract-ocr-eng tesseract-ocr-fra poppler-utils fonts-dejavu-core nodejs
          for tool in bwrap unrar tesseract pdftoppm node; do command -v "$tool"; done
      - name: Configure isolated test prerequisites on the ephemeral runner
        run: |
          # Ubuntu AppArmor otherwise denies network-namespace loopback setup.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          bwrap --unshare-all --ro-bind / / --proc /proc --dev /dev /bin/true
          # Lab path guards also apply to synthetic test output.
          sudo install -d -o "$(id -u)" -g "$(id -g)" /data/booksys-ci-tmp
          echo "TMPDIR=/data/booksys-ci-tmp" >> "$GITHUB_ENV"
      - name: Install the locked development environment
        run: |
          echo "BEADS_DIR=$RUNNER_TEMP/nonexistent-test-beads" >> "$GITHUB_ENV"
          uv sync --locked --extra dev
      - name: Select only the disposable CI PostgreSQL authority
        run: |
          install -m 600 /dev/null "$RUNNER_TEMP/booksys-test.dsn"
          printf '%s\n' 'host=127.0.0.1 port=5432 dbname=booksys_ci user=postgres' > "$RUNNER_TEMP/booksys-test.dsn"
          echo "BOOKSYS_TEST_PG_DSN_FILE=$RUNNER_TEMP/booksys-test.dsn" >> "$GITHUB_ENV"
      - name: Run the complete offline suite
        run: uv run --no-sync python -m unittest discover -s tests -v
      - name: Run existing type checks
        run: uv run --no-sync mypy booksys.py pipeline.py fiches.py library booksys_core ops/image_validation.py
  worker-image:
    needs: scope
    if: needs.scope.outputs.worker == 'true'
    # Both syntaxes bind reusable workflows to this commit. actionlint 1.7.12
    # does not yet accept the newer $/ spelling.
    uses: ./.github/workflows/image-validation.yml # zizmor: ignore[self-repository]
    with:
      image: worker
      dockerfile: Dockerfile
  library-image:
    needs: scope
    if: needs.scope.outputs.library == 'true'
    uses: ./.github/workflows/image-validation.yml # zizmor: ignore[self-repository]
    with:
      image: library
      dockerfile: Dockerfile.library
  byparr-image:
    needs: scope
    if: needs.scope.outputs.byparr == 'true'
    uses: ./.github/workflows/image-validation.yml # zizmor: ignore[self-repository]
    with:
      image: byparr
      dockerfile: Dockerfile.byparr
  required:
    name: required
    if: ${{ always() }}
    needs: [scope, policy, offline-tests, worker-image, library-image, byparr-image]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Require success or an intentional scope skip
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: python3 ops/ci_scope.py --check-results "$RESULTS"
