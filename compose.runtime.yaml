name: booksys
services:
  byparr:
    image: ghcr.io/thephaseless/byparr@sha256:c66fa161187b8fa527bfad7eefa2647ea1c553f77df68cbffd6fe83366d1787b
    restart: unless-stopped
    shm_size: 512m
    mem_limit: 1536m
    cpus: 2
    security_opt:
      - no-new-privileges:true
    healthcheck:
      # Upstream /health launches a browser against Google. Readiness only needs HTTP.
      test: ["CMD", "curl", "--fail", "--silent", "--output", "/dev/null", "http://127.0.0.1:8191/docs"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 20s
  worker:
    build: .
    image: booksys-worker:local
    restart: unless-stopped
    command:
      - --directory
      - /state
      - --byparr
      - http://byparr:8191/v1
      - --pyload
      - http://pyload:8000
      - --credentials
      - /secrets/pyload.json
      - --interval
      - "900"
    volumes:
      - /data/booksys/state:/state
      - /data/booksys/secrets:/secrets:ro
    depends_on:
      byparr:
        condition: service_healthy
    healthcheck:
      disable: true
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m
    cpus: 1
