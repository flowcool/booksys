name: booksys
services:
  byparr:
    build:
      context: .
      dockerfile: Dockerfile.byparr
    image: booksys-byparr:local
    logging:
      driver: json-file
      options:
        max-size: "${DOCKER_LOGGING_MAX_SIZE:?Load the canonical common environment}"
        max-file: "${DOCKER_LOGGING_MAX_FILE:?Load the canonical common environment}"
    restart: unless-stopped
    shm_size: 512m
    mem_limit: 1536m
    cpus: 2
    security_opt:
      - no-new-privileges:true
    healthcheck:
      # Booksys /health checks the local session manager without navigation.
      test: ["CMD", "curl", "--fail", "--silent", "--output", "/dev/null", "http://127.0.0.1:8191/health"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 20s
  worker:
    build: .
    image: booksys-worker:local
    logging:
      driver: json-file
      options:
        max-size: "${DOCKER_LOGGING_MAX_SIZE:?Load the canonical common environment}"
        max-file: "${DOCKER_LOGGING_MAX_FILE:?Load the canonical common environment}"
    restart: unless-stopped
    command:
      - --directory
      - /state
      - --byparr
      - http://byparr:8191/v1
      - --pyload
      - http://pyload:8000
      - --credentials
      - /secrets/pyload.json
      - --interval
      - "900"
      - --downloads
      - /downloads
    volumes:
      - /data/booksys/state:/state
      - /data/booksys/secrets:/secrets:ro
      - /data/booksys/downloads:/downloads
    depends_on:
      byparr:
        condition: service_healthy
    healthcheck:
      disable: true
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m
    cpus: 1
