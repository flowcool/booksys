name: booksys-shared
services:
  pyload:
    container_name: booksys-pyload
    image: sha256:222f1486954e052f61d3361ab2ad5e97e17f698d65c3a199e4689a3268a68a64
    restart: unless-stopped
    stop_grace_period: 60s
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
    ports:
      - "0.0.0.0:8000:8000"
    environment:
      PUID: "1000"
      PGID: "1000"
      TZ: Europe/Zurich
      PYTHONPATH: /opt/booksys-python
    volumes:
      - /data/booksys/config/pyload:/config
      - /data/booksys/downloads:/downloads
      - ./ops/pyload_python:/opt/booksys-python:ro
    networks:
      default:
        aliases: [pyload]
networks:
  default:
    external: true
    name: booksys_default
