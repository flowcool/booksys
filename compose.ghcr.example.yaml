# CLI examples. For the complete explicit topology, use compose.stack.yaml.
# Replace version tags with verified digests for operational rollback.
services:
  byparr:
    image: ghcr.io/flowcool/booksys-byparr:0.1.0
    ports: ["127.0.0.1:8191:8191"]
    profiles: [collector]
  worker:
    image: ghcr.io/flowcool/booksys-worker:0.1.0
    command: ["-m", "library.cli", "--help"]
    profiles: [collector]
    # This image also provides controller, queue, web, tools and launcher roles.
  library:
    image: ghcr.io/flowcool/booksys-library:0.1.0
    command: ["--help"]
    profiles: [reader]
    network_mode: none
    # The restricted launcher invokes readers with bounded synthetic or owned inputs.
