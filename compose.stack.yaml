# Candidate topology. Qualification and exact cutover proof remain required.
name: ${BOOKSYS_PROJECT:-booksys}
x-business: &id001
  image: ${BOOKSYS_APP_IMAGE:?Select an identified application candidate}
  user: 1000:1000
  read_only: true
  cap_drop: &id014
  - ALL
  security_opt: &id015
  - no-new-privileges:true
  restart: on-failure
  stop_grace_period: 30s
  pids_limit: 48
  cgroup_parent: ${BOOKSYS_CGROUP_PARENT:?Select the qualified shared business slice}
  logging: &id016
    driver: json-file
    options:
      max-size: 10m
      max-file: '3'
  tmpfs: &id017
  - /tmp:rw,nosuid,nodev,noexec,size=16m,mode=1777
  cgroup: host
  init: true
  environment: &id002
    BOOKSYS_ADMISSION_STATE: /data/booksys/library-lab/state
    BOOKSYS_ACTIVITY_DIR: /data/booksys/library-lab/state/activity
    BOOKSYS_RELOCATION_RECEIPT: /config/relocation.json
    BOOKSYS_READER_SOCKET: /reader-ipc/reader.sock
    BOOKSYS_READER_INPUTS: /data/booksys
    BOOKSYS_READER_JOBS: ${BOOKSYS_NAS_FILES_ROOT}/work/reader-jobs
    BOOKSYS_ATTACHMENT_ROOT: /media/attachments
    BOOKSYS_PIECES_ROOT: /media/pieces
    BOOKSYS_NAS_WRITER_UID: '1003'
    BOOKSYS_READER_REQUESTS: /data/booksys/library-lab/state/reader-requests
    BOOKSYS_SUPERVISOR: compose
    TMPDIR: /nas-tmp
    BOOKSYS_PYLOAD_SCRIPTS_ROOT: /pyload-scripts
    BOOKSYS_NFS_FILES_SOURCE: ${BOOKSYS_NFS_FILES_SOURCE:?Select qualified files export}
    BOOKSYS_NFS_LIBRARY_SOURCE: ${BOOKSYS_NFS_LIBRARY_SOURCE:?Select qualified library
      export}
    BOOKSYS_FICHE_ROOT: /data/booksys/state/downloads
    BOOKSYS_BUNDLE_INPUT_ROOT: /data/booksys/library-lab/state/bundle-inputs
  volumes:
  - &postgres_socket
    type: bind
    source: ${BOOKSYS_POSTGRES_SOCKET_ROOT:?Select local PostgreSQL socket directory}
    target: ${BOOKSYS_POSTGRES_SOCKET_ROOT:?Select local PostgreSQL socket directory}
    bind:
      create_host_path: false
  - &postgres_app_credential
    type: bind
    source: ${BOOKSYS_APP_DSN_FILE:?Select private application PostgreSQL credential}
    target: ${BOOKSYS_APP_DSN_FILE:?Select private application PostgreSQL credential}
    read_only: true
    bind:
      create_host_path: false
  - &id003
    type: bind
    source: ${BOOKSYS_LOCAL_ROOT:?Select local technical state}
    target: /data/booksys/library-lab
    read_only: false
    bind:
      create_host_path: false
  - &id004
    type: bind
    source: ${BOOKSYS_COLLECTOR_ROOT:?Select collector state}
    target: /data/booksys/state
    read_only: false
    bind:
      create_host_path: false
  - &id005
    type: bind
    source: ${BOOKSYS_STACK_CONFIG:?Select qualified stack configuration}
    target: /config
    read_only: true
    bind:
      create_host_path: false
  - &id006
    type: bind
    source: ${BOOKSYS_CREDENTIALS_FILE:?Select retained pyLoad credentials}
    target: /secrets/pyload.json
    read_only: true
    bind:
      create_host_path: false
  - &id007
    type: bind
    source: ${BOOKSYS_NAS_FILES_ROOT:?Select qualified NAS files mount}/downloads
    target: /data/booksys/downloads
    read_only: true
    bind: &id018
      create_host_path: false
  - &id008
    type: bind
    source: ${BOOKSYS_NAS_FILES_ROOT}/work/bundle-inputs
    target: /data/booksys/library-lab/state/bundle-inputs
    read_only: false
    bind: &id019
      create_host_path: false
  - &id009
    type: bind
    source: ${BOOKSYS_NAS_FILES_ROOT}/work/web-covers
    target: /data/booksys/library-lab/evidence/web-covers
    read_only: false
    bind:
      create_host_path: false
  - &id010
    type: bind
    source: ${BOOKSYS_NAS_FILES_ROOT}/work/collector-covers
    target: /data/booksys/state/downloads
    read_only: false
    bind:
      create_host_path: false
  - &id011
    type: bind
    source: ${BOOKSYS_NAS_LIBRARY_ROOT:?Select qualified managed-library mount}
    target: /data/booksys/library-lab/library
    read_only: false
    bind: &id020
      create_host_path: false
  - type: bind
    source: ${BOOKSYS_READER_IPC_ROOT:?Select private reader IPC directory}
    target: /reader-ipc
    bind: &id012
      create_host_path: false
    read_only: true
  - type: bind
    source: ${BOOKSYS_NAS_FILES_ROOT}/work/reader-jobs
    target: ${BOOKSYS_NAS_FILES_ROOT}/work/reader-jobs
    bind:
      create_host_path: false
    read_only: true
  - type: bind
    source: /sys/fs/cgroup
    target: /sys/fs/cgroup
    read_only: true
    bind:
      create_host_path: false
  - type: bind
    source: ${BOOKSYS_NAS_FILES_ROOT}/work/attachments
    target: /media/attachments
    bind:
      create_host_path: false
  - type: bind
    source: ${BOOKSYS_NAS_FILES_ROOT}/work/pieces
    target: /media/pieces
    bind:
      create_host_path: false
  - type: bind
    source: ${BOOKSYS_NAS_FILES_ROOT}/work/tmp
    target: /nas-tmp
    bind:
      create_host_path: false
  - type: bind
    source: ${BOOKSYS_NAS_FILES_ROOT}
    target: /nas-identity
    read_only: true
    bind:
      create_host_path: false
  - type: bind
    source: ${BOOKSYS_PYLOAD_CONFIG_ROOT}/scripts
    target: /pyload-scripts
    read_only: true
    bind:
      create_host_path: false
  - &id013
    type: bind
    source: ${BOOKSYS_NAS_LIBRARY_EXPORT_ROOT:?Select qualified library export mount}
    target: /nas-library-identity
    read_only: true
    bind:
      create_host_path: false
services:
  postgres:
    profiles: [retained-dependencies]
    image: ${BOOKSYS_POSTGRES_IMAGE:?Select exact PostgreSQL 18.6 image}
    container_name: ${BOOKSYS_PROJECT:-booksys}-postgres
    user: 999:999
    group_add: ['1000']
    network_mode: none
    restart: unless-stopped
    stop_grace_period: 60s
    security_opt: *id015
    cap_drop: *id014
    logging: *id016
    mem_limit: 512m
    memswap_limit: 512m
    pids_limit: 128
    cpus: '1'
    tmpfs:
    - /var/run/postgresql:rw,nosuid,nodev,noexec,size=1m,mode=0770,uid=999,gid=1000
    healthcheck:
      test:
      - CMD-SHELL
      - 'export PGPASSWORD="$$(cat /secrets/postgres-password)"; test "$$(psql -X --no-password --set=ON_ERROR_STOP=1 --username=booksys_migration --dbname=booksys --tuples-only --no-align --command="SELECT current_database()")" = booksys'
      interval: 10s
      timeout: 3s
      retries: 6
    environment:
      POSTGRES_DB: booksys
      POSTGRES_USER: booksys_migration
      POSTGRES_PASSWORD_FILE: /secrets/postgres-password
      POSTGRES_INITDB_ARGS: --auth-local=scram-sha-256 --auth-host=scram-sha-256
      PGHOST: ${BOOKSYS_POSTGRES_SOCKET_ROOT}
      PGDATA: /var/lib/postgresql/18/docker
    # The pinned entrypoint clears PGHOST for its temporary bootstrap psql.
    # Its private default socket is never mounted into another service.
    command: ['postgres', '-c', 'listen_addresses=', '-c', 'unix_socket_directories=/var/run/postgresql,${BOOKSYS_POSTGRES_SOCKET_ROOT}', '-c', 'unix_socket_permissions=0770', '-c', 'unix_socket_group=1000', '-c', 'max_connections=40', '-c', 'shared_buffers=128MB', '-c', 'work_mem=4MB']
    volumes:
    - type: bind
      source: ${BOOKSYS_POSTGRES_ROOT:?Select local PostgreSQL data under /data}
      target: /var/lib/postgresql
      bind:
        create_host_path: false
    - *postgres_socket
    - type: bind
      source: ${BOOKSYS_POSTGRES_PASSWORD_FILE:?Select private PostgreSQL initialization credential}
      target: /secrets/postgres-password
      read_only: true
      bind:
        create_host_path: false
  controller:
    depends_on:
      reader-launcher:
        condition: service_healthy
    <<: *id001
    environment:
      <<: *id002
      BOOKSYS_NAS_PROBE_ROLE: controller
      BOOKSYS_NAS_CONTRACT: /config/nas-controller.json
    volumes:
    - *postgres_socket
    - *postgres_app_credential
    - *id003
    - *id004
    - *id005
    - *id006
    - *id007
    - *id008
    - *id009
    - *id010
    - *id011
    - type: bind
      source: ${BOOKSYS_IPC_ROOT:?Select private IPC directory}
      target: /ipc
      read_only: false
      bind:
        create_host_path: false
    - type: bind
      source: ${BOOKSYS_READER_IPC_ROOT:?Select private reader IPC directory}
      target: /reader-ipc
      bind: *id012
      read_only: true
    - type: bind
      source: ${BOOKSYS_NAS_FILES_ROOT}/work/reader-jobs
      target: ${BOOKSYS_NAS_FILES_ROOT}/work/reader-jobs
      bind:
        create_host_path: false
      read_only: true
    - type: bind
      source: /sys/fs/cgroup
      target: /sys/fs/cgroup
      read_only: true
      bind:
        create_host_path: false
    - type: bind
      source: ${BOOKSYS_NAS_FILES_ROOT}/work/attachments
      target: /media/attachments
      bind:
        create_host_path: false
    - type: bind
      source: ${BOOKSYS_NAS_FILES_ROOT}/work/pieces
      target: /media/pieces
      bind:
        create_host_path: false
    - type: bind
      source: ${BOOKSYS_NAS_FILES_ROOT}/work/tmp
      target: /nas-tmp
      bind:
        create_host_path: false
    - type: bind
      source: ${BOOKSYS_NAS_FILES_ROOT}
      target: /nas-identity
      read_only: true
      bind:
        create_host_path: false
    - type: bind
      source: ${BOOKSYS_PYLOAD_CONFIG_ROOT}/scripts
      target: /pyload-scripts
      read_only: true
      bind:
        create_host_path: false
    - *id013
    mem_limit: 1024m
    memswap_limit: 1024m
    cpus: '1'
    container_name: ${BOOKSYS_PROJECT:-booksys}-controller
    command:
    - ops/library_service.py
    - --root
    - /data/booksys/library-lab
    - --credentials
    - /secrets/pyload.json
    - --activity
    - --independent-queues
    - --ipc-socket
    - /ipc/controller.sock
    - --public-host
    - ${BOOKSYS_PUBLIC_HOST:?Preserve the operator endpoint}
    - --public-origin
    - ${BOOKSYS_PUBLIC_ORIGIN:-}
    - --pyload
    - http://pyload:8000
    healthcheck:
      test:
      - CMD
      - /app/.venv/bin/python
      - -c
      - |
        import http.client,json
        from pathlib import Path
        from library.compose_transport import ReconnectingRemote
        client=http.client.HTTPConnection('web',8768,timeout=2)
        try:
            client.connect()
        except OSError:
            client.close()
            remote=ReconnectingRemote(Path('/ipc/controller.sock'))
            try:
                value=remote.call('token',dict(payload={},host='${BOOKSYS_PUBLIC_HOST}',origin='',token=''))
            finally:
                remote.close()
        else:
            try:
                client.request('GET','/api/resolution/token',headers={'Host':'${BOOKSYS_PUBLIC_HOST}'})
                response=client.getresponse()
                assert response.status==200
                value=json.loads(response.read())
            finally:
                client.close()
        assert isinstance(value.get('token'),str)
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
  discovery:
    depends_on:
      controller:
        condition: service_healthy
    <<: *id001
    environment:
      <<: *id002
      BOOKSYS_NAS_PROBE_ROLE: discovery
      BOOKSYS_NAS_CONTRACT: /config/nas-discovery.json
    mem_limit: 512m
    memswap_limit: 512m
    cpus: '1'
    container_name: ${BOOKSYS_PROJECT:-booksys}-discovery
    command:
    - -m
    - library.stage_worker
    - --root
    - /data/booksys/library-lab
    - --collector
    - /data/booksys/state
    - --reception
    - /data/booksys/downloads
    - --credentials
    - /secrets/pyload.json
    - --endpoint
    - http://pyload:8000
    - --byparr
    - http://byparr:8191/v1
    - --queue
    - discovery
    healthcheck:
      test:
      - CMD
      - /app/.venv/bin/python
      - -c
      - &actor_readiness >-
        import os,sys,time; from pathlib import Path;
        from library.operational_state import RuntimeObservation;
        from library.postgres import Database;
        boot=int(next(x.split()[1] for x in Path('/proc/stat').read_text().splitlines() if x.startswith('btime ')));
        started=boot+int(Path('/proc/1/stat').read_text().rsplit(')',1)[1].split()[19])/os.sysconf('SC_CLK_TCK');
        pulses=RuntimeObservation(Database.configured(Path('/data/booksys/library-lab/state'))).heartbeats();
        assert all(started <= pulses.get(r,0) <= time.time() and time.time()-pulses.get(r,0) <= 15 for r in sys.argv[1:])
      - discovery
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
  collection:
    depends_on:
      discovery:
        condition: service_healthy
    <<: *id001
    environment:
      <<: *id002
      BOOKSYS_NAS_PROBE_ROLE: collection
      BOOKSYS_NAS_CONTRACT: /config/nas-collection.json
    mem_limit: 512m
    memswap_limit: 512m
    cpus: '1'
    container_name: ${BOOKSYS_PROJECT:-booksys}-collection
    command:
    - -m
    - library.stage_worker
    - --root
    - /data/booksys/library-lab
    - --collector
    - /data/booksys/state
    - --reception
    - /data/booksys/downloads
    - --credentials
    - /secrets/pyload.json
    - --endpoint
    - http://pyload:8000
    - --byparr
    - http://byparr:8191/v1
    - --queue
    - collection
    healthcheck:
      test:
      - CMD
      - /app/.venv/bin/python
      - -c
      - *actor_readiness
      - collection
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
  intake:
    depends_on:
      collection:
        condition: service_healthy
    <<: *id001
    environment:
      <<: *id002
      BOOKSYS_NAS_PROBE_ROLE: intake
      BOOKSYS_NAS_CONTRACT: /config/nas-intake.json
    mem_limit: 256m
    memswap_limit: 256m
    cpus: '1'
    container_name: ${BOOKSYS_PROJECT:-booksys}-intake
    command:
    - -m
    - library.stage_worker
    - --root
    - /data/booksys/library-lab
    - --collector
    - /data/booksys/state
    - --reception
    - /data/booksys/downloads
    - --credentials
    - /secrets/pyload.json
    - --endpoint
    - http://pyload:8000
    - --byparr
    - http://byparr:8191/v1
    - --queue
    - intake
    healthcheck:
      test:
      - CMD
      - /app/.venv/bin/python
      - -c
      - *actor_readiness
      - intake
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
  processing:
    depends_on:
      intake:
        condition: service_healthy
    <<: *id001
    environment:
      <<: *id002
      BOOKSYS_NAS_PROBE_ROLE: processing
      BOOKSYS_NAS_CONTRACT: /config/nas-processing.json
    mem_limit: 512m
    memswap_limit: 512m
    cpus: '2'
    pids_limit: 96
    container_name: ${BOOKSYS_PROJECT:-booksys}-processing
    command:
    - -m
    - supervisor.supervisord
    - --configuration
    - /app/ops/processing.conf
    healthcheck:
      test:
      - CMD
      - /app/.venv/bin/python
      - -c
      - *actor_readiness
      - ocr
      - metadata
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
  copies:
    depends_on:
      processing:
        condition: service_healthy
    <<: *id001
    environment:
      <<: *id002
      BOOKSYS_NAS_PROBE_ROLE: copies
      BOOKSYS_NAS_CONTRACT: /config/nas-copies.json
    mem_limit: 256m
    memswap_limit: 256m
    cpus: '1'
    container_name: ${BOOKSYS_PROJECT:-booksys}-copies
    command:
    - -m
    - library.stage_worker
    - --root
    - /data/booksys/library-lab
    - --collector
    - /data/booksys/state
    - --reception
    - /data/booksys/downloads
    - --credentials
    - /secrets/pyload.json
    - --endpoint
    - http://pyload:8000
    - --byparr
    - http://byparr:8191/v1
    - --queue
    - copies
    healthcheck:
      test:
      - CMD
      - /app/.venv/bin/python
      - -c
      - *actor_readiness
      - copies
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
  routing:
    depends_on:
      copies:
        condition: service_healthy
    <<: *id001
    environment:
      <<: *id002
      BOOKSYS_NAS_PROBE_ROLE: routing
      BOOKSYS_NAS_CONTRACT: /config/nas-routing.json
    mem_limit: 512m
    memswap_limit: 512m
    cpus: '1'
    container_name: ${BOOKSYS_PROJECT:-booksys}-routing
    command:
    - -m
    - library.stage_worker
    - --root
    - /data/booksys/library-lab
    - --collector
    - /data/booksys/state
    - --reception
    - /data/booksys/downloads
    - --credentials
    - /secrets/pyload.json
    - --endpoint
    - http://pyload:8000
    - --byparr
    - http://byparr:8191/v1
    - --queue
    - routing
    healthcheck:
      test:
      - CMD
      - /app/.venv/bin/python
      - -c
      - *actor_readiness
      - routing
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
  retirement:
    depends_on:
      routing:
        condition: service_healthy
    <<: *id001
    environment:
      <<: *id002
      BOOKSYS_NAS_PROBE_ROLE: retirement
      BOOKSYS_NAS_CONTRACT: /config/nas-retirement.json
    mem_limit: 512m
    memswap_limit: 512m
    cpus: '1'
    container_name: ${BOOKSYS_PROJECT:-booksys}-retirement
    command:
    - -m
    - library.stage_worker
    - --root
    - /data/booksys/library-lab
    - --collector
    - /data/booksys/state
    - --reception
    - /data/booksys/downloads
    - --credentials
    - /secrets/pyload.json
    - --endpoint
    - http://pyload:8000
    - --byparr
    - http://byparr:8191/v1
    - --queue
    - retirement
    healthcheck:
      test:
      - CMD
      - /app/.venv/bin/python
      - -c
      - *actor_readiness
      - retirement
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
  web:
    depends_on:
      controller:
        condition: service_healthy
    image: ${BOOKSYS_APP_IMAGE:?Select an identified application candidate}
    user: 1000:1000
    read_only: true
    cap_drop: *id014
    security_opt: *id015
    restart: on-failure
    stop_grace_period: 30s
    pids_limit: 48
    mem_limit: 64m
    memswap_limit: 64m
    cpus: '1'
    cgroup_parent: ${BOOKSYS_CGROUP_PARENT:?Select the qualified shared business slice}
    logging: *id016
    tmpfs: *id017
    environment:
      BOOKSYS_PUBLIC_HOST: ${BOOKSYS_PUBLIC_HOST}
    container_name: ${BOOKSYS_PROJECT:-booksys}-web
    volumes:
    - type: bind
      source: ${BOOKSYS_IPC_ROOT}
      target: /ipc
      read_only: true
      bind:
        create_host_path: false
    ports:
    - ${BOOKSYS_WEB_BIND_ADDRESS:?Preserve the existing web listen address}:${BOOKSYS_WEB_PORT:-8768}:8768
    command:
    - -m
    - library.compose_web
    - --socket
    - /ipc/controller.sock
    - --public-host
    - ${BOOKSYS_PUBLIC_HOST}
    - --public-origin
    - ${BOOKSYS_PUBLIC_ORIGIN:-}
    healthcheck:
      test:
      - CMD
      - /app/.venv/bin/python
      - -m
      - library.stack_health
      - web
      interval: 30s
      timeout: 10s
      retries: 3
  byparr:
    profiles: [retained-dependencies]
    restart: unless-stopped
    stop_grace_period: 30s
    logging: *id016
    security_opt: *id015
    container_name: ${BOOKSYS_PROJECT:-booksys}-byparr
    image: ${BOOKSYS_BYPARR_IMAGE:?Select retained Byparr extension}
    shm_size: 512m
    mem_limit: 1536m
    memswap_limit: 1536m
    cpus: '2'
    pids_limit: 1024
    healthcheck:
      test:
      - CMD
      - curl
      - --fail
      - --silent
      - --output
      - /dev/null
      - http://127.0.0.1:8191/health
      interval: 30s
      timeout: 10s
      retries: 6
      start_period: 20s
  pyload:
    profiles: [retained-dependencies]
    restart: unless-stopped
    stop_grace_period: 60s
    logging: *id016
    security_opt: *id015
    container_name: ${BOOKSYS_PROJECT:-booksys}-pyload
    image: ${BOOKSYS_PYLOAD_IMAGE:?Select retained pyLoad extension}
    mem_limit: 1024m
    memswap_limit: 1024m
    cpus: '1'
    pids_limit: 256
    ports:
    - ${BOOKSYS_BIND_ADDRESS:-0.0.0.0}:${BOOKSYS_PYLOAD_PORT:-8000}:8000
    environment:
      PUID: '1000'
      PGID: '1000'
      TZ: ${TZ:-Europe/Zurich}
      BOOKSYS_NFS_SOURCE: ${BOOKSYS_NFS_FILES_SOURCE}
      BOOKSYS_NFS_SENTINEL_SHA256: 4f34ea560d283a641de4daf0a32b3ceea7ef34882e90f11ef1a6214b8fb4fc40
    volumes:
    - type: bind
      source: ${BOOKSYS_PYLOAD_CONFIG_ROOT:?Select moved retained pyLoad config}
      target: /config
      read_only: false
      bind:
        create_host_path: false
    - type: bind
      source: ${BOOKSYS_NAS_FILES_ROOT}/downloads
      target: /downloads
      read_only: false
      bind:
        create_host_path: false
    - type: bind
      source: ${BOOKSYS_NAS_FILES_ROOT}
      target: /nas-identity
      read_only: true
      bind:
        create_host_path: false
    healthcheck:
      test:
      - CMD
      - curl
      - --fail
      - --silent
      - --output
      - /dev/null
      - http://127.0.0.1:8000/
      interval: 30s
      timeout: 10s
      retries: 6
      start_period: 30s
  tools:
    <<: *id001
    restart: 'no'
    environment:
      <<: *id002
      BOOKSYS_NAS_PROBE_ROLE: tools
      BOOKSYS_NAS_CONTRACT: /config/nas-tools.json
    mem_limit: 512m
    memswap_limit: 512m
    cpus: '1'
    container_name: ${BOOKSYS_PROJECT:-booksys}-tools
    profiles:
    - tools
    command:
    - -m
    - library.cli
    - --help
  reader-launcher:
    user: 1000:1000
    read_only: true
    cap_drop: *id014
    security_opt: *id015
    restart: on-failure
    stop_grace_period: 30s
    pids_limit: 48
    logging: *id016
    tmpfs: *id017
    cgroup_parent: ${BOOKSYS_CGROUP_PARENT:?Select the qualified shared business slice}
    image: ${BOOKSYS_LAUNCHER_IMAGE:?Select the restricted launcher candidate}
    container_name: ${BOOKSYS_PROJECT:-booksys}-reader-launcher
    mem_limit: 128m
    memswap_limit: 128m
    cpus: '1'
    network_mode: none
    group_add:
    - ${BOOKSYS_DOCKER_GID:?Select daemon socket group}
    volumes:
    - *postgres_socket
    - type: bind
      source: ${BOOKSYS_LAUNCHER_DATABASE_ROOT:?Select launcher-only PostgreSQL selector}
      target: /launcher-db
      read_only: true
      bind:
        create_host_path: false
    - type: bind
      source: ${BOOKSYS_LAUNCHER_DSN_FILE:?Select restricted launcher PostgreSQL credential}
      target: ${BOOKSYS_LAUNCHER_DSN_FILE:?Select restricted launcher PostgreSQL credential}
      read_only: true
      bind:
        create_host_path: false
    - type: bind
      source: ${BOOKSYS_READER_IPC_ROOT:?Select private reader IPC directory}
      target: /reader-ipc
      bind: *id012
    - type: bind
      source: /run/docker.sock
      target: /var/run/docker.sock
      bind:
        create_host_path: false
    - type: bind
      source: ${BOOKSYS_LOCAL_ROOT}/state
      target: /state
      bind:
        create_host_path: false
    - type: bind
      source: ${BOOKSYS_NAS_FILES_ROOT}/work/reader-jobs
      target: ${BOOKSYS_NAS_FILES_ROOT}/work/reader-jobs
      bind:
        create_host_path: false
    - type: bind
      source: ${BOOKSYS_NAS_FILES_ROOT:?Select qualified NAS files mount}/downloads
      target: /data/booksys/downloads
      read_only: true
      bind: *id018
    - type: bind
      source: ${BOOKSYS_NAS_FILES_ROOT}/work/bundle-inputs
      target: /data/booksys/library-lab/state/bundle-inputs
      read_only: true
      bind: *id019
    - type: bind
      source: ${BOOKSYS_NAS_LIBRARY_ROOT:?Select qualified managed-library mount}
      target: /data/booksys/library-lab/library
      read_only: true
      bind: *id020
    - type: bind
      source: ${BOOKSYS_STACK_CONFIG}
      target: /config
      read_only: true
      bind:
        create_host_path: false
    - type: bind
      source: ${BOOKSYS_NAS_FILES_ROOT}
      target: /nas-identity
      read_only: true
      bind:
        create_host_path: false
    - *id013
    command:
    - -m
    - library.reader_service
    - --socket
    - /reader-ipc/reader.sock
    - --inputs
    - /data/booksys
    - --jobs
    - ${BOOKSYS_NAS_FILES_ROOT}/work/reader-jobs
    - --state
    - /state
    - --image
    - ${BOOKSYS_READER_IMAGE:?Select exact retained decoder ID}
    - --job-uid
    - '1003'
    - --cgroup-parent
    - ${BOOKSYS_CGROUP_PARENT}
    healthcheck:
      test:
      - CMD
      - /app/.venv/bin/python
      - -c
      - "import os; os.environ['BOOKSYS_READER_SOCKET']='/reader-ipc/reader.sock'; from library.reader_client import available; assert available()"
      interval: 5s
      timeout: 5s
      retries: 6
      start_period: 5s
    environment:
      BOOKSYS_LAUNCHER_DATABASE_DIR: /launcher-db
      BOOKSYS_HOST_DOWNLOADS: ${BOOKSYS_NAS_FILES_ROOT}/downloads
      BOOKSYS_HOST_BUNDLES: ${BOOKSYS_NAS_FILES_ROOT}/work/bundle-inputs
      BOOKSYS_HOST_LIBRARY: ${BOOKSYS_NAS_LIBRARY_ROOT}
      BOOKSYS_NAS_CONTRACT: /config/launcher-nas.json
      BOOKSYS_COMPOSE_PROJECT: ${BOOKSYS_PROJECT:-booksys}
      BOOKSYS_RETAINED_SOURCES_FILE: /config/retained-sources.json
      BOOKSYS_NFS_FILES_SOURCE: ${BOOKSYS_NFS_FILES_SOURCE}
      BOOKSYS_NFS_LIBRARY_SOURCE: ${BOOKSYS_NFS_LIBRARY_SOURCE}
      BOOKSYS_READER_JOBS: ${BOOKSYS_NAS_FILES_ROOT}/work/reader-jobs

# Candidate services join the exact retained dependency network.
networks:
  default:
    external: true
    name: ${BOOKSYS_NETWORK:?Select the exact retained dependency network}
