# Candidate topology. Qualification and exact cutover proof remain required.
name: ${BOOKSYS_PROJECT:-booksys}
x-business: &business
  image: ${BOOKSYS_APP_IMAGE:?Select an identified application candidate}
  user: 1000:1000
  read_only: true
  cap_drop: &cap_drop_all
  - ALL
  security_opt: &no_new_privileges
  - no-new-privileges:true
  restart: on-failure
  # Return a failed startup or shutdown within the recorded lifecycle deadline.
  stop_grace_period: 30s
  # Bound service processes and threads; the browser requires more tasks than an application worker.
  pids_limit: 48
  cgroup_parent: ${BOOKSYS_CGROUP_PARENT:?Select the qualified shared business slice}
  logging: &json_logging
    driver: json-file
    options:
      # Rotate container logs at three files of 10m to bound local disk consumption.
      max-size: ${DOCKER_LOGGING_MAX_SIZE:-10m}
      max-file: ${DOCKER_LOGGING_MAX_FILE:-3}
  tmpfs: &tmp_tmpfs
  # Bound memory-backed temporary files and browser shared memory inside service resource limits.
  - /tmp:rw,nosuid,nodev,noexec,size=16m,mode=1777
  cgroup: host
  init: true
  environment: &business_env
    BOOKSYS_CRAWL_PAGES: ${BOOKSYS_CRAWL_PAGES:-100}  # newest catalogue pages the collector reads: a pass reads 5 fresh pages + 10 deep pages; passes are 5 min apart until the deep crawl reaches this page, then once a day (library/native_projection.py)
    BOOKSYS_WORK_STAGES: ${BOOKSYS_WORK_STAGES:-}  # stages that run on work_items; empty = the old actor everywhere
    BOOKSYS_ADMISSION_STATE: /data/booksys/library-lab/state
    BOOKSYS_RELOCATION_RECEIPT: /config/relocation.json
    BOOKSYS_ATTACHMENT_ROOT: /media/attachments
    BOOKSYS_PIECES_ROOT: /media/pieces
    BOOKSYS_NAS_WRITER_UID: '1003'
    BOOKSYS_SUPERVISOR: compose
    TMPDIR: /nas-tmp
    BOOKSYS_PYLOAD_SCRIPTS_ROOT: /pyload-scripts
    BOOKSYS_NFS_FILES_SOURCE: ${BOOKSYS_NFS_FILES_SOURCE:?Select qualified files export}
    BOOKSYS_NFS_LIBRARY_SOURCE: ${BOOKSYS_NFS_LIBRARY_SOURCE:?Select qualified library
      export}
    BOOKSYS_FICHE_ROOT: /data/booksys/state/downloads
    BOOKSYS_BUNDLE_INPUT_ROOT: /data/booksys/library-lab/state/bundle-inputs
  volumes:
  - &vol_work
    type: bind
    source: ${BOOKSYS_LOCAL_ROOT}/work
    target: /data/booksys/work
    read_only: false
    bind:
      create_host_path: false
  - &postgres_socket
    type: bind
    source: ${BOOKSYS_POSTGRES_SOCKET_ROOT:?Select local PostgreSQL socket directory}
    target: ${BOOKSYS_POSTGRES_SOCKET_ROOT:?Select local PostgreSQL socket directory}
    bind:
      create_host_path: false
  - &postgres_app_credential
    type: bind
    source: ${BOOKSYS_APP_DSN_FILE:?Select private application PostgreSQL credential}
    target: ${BOOKSYS_APP_DSN_FILE:?Select private application PostgreSQL credential}
    read_only: true
    bind:
      create_host_path: false
  - &vol_local_state
    type: bind
    source: ${BOOKSYS_LOCAL_ROOT:?Select local technical state}
    target: /data/booksys/library-lab
    read_only: false
    bind:
      create_host_path: false
  - &vol_collector_state
    type: bind
    source: ${BOOKSYS_COLLECTOR_ROOT:?Select collector state}
    target: /data/booksys/state
    read_only: false
    bind:
      create_host_path: false
  - &vol_stack_config
    type: bind
    source: ${BOOKSYS_STACK_CONFIG:?Select qualified stack configuration}
    target: /config
    read_only: true
    bind:
      create_host_path: false
  - &vol_pyload_credentials
    type: bind
    source: ${BOOKSYS_CREDENTIALS_FILE:?Select retained pyLoad credentials}
    target: /secrets/pyload.json
    read_only: true
    bind:
      create_host_path: false
  - &vol_nas_downloads
    type: bind
    source: ${BOOKSYS_NAS_FILES_ROOT:?Select qualified NAS files mount}/downloads
    target: /data/booksys/downloads
    read_only: true
    bind: &bind_existing_a
      create_host_path: false
  - &vol_bundle_inputs
    type: bind
    source: ${BOOKSYS_LOCAL_ROOT}/bundle-inputs
    target: /data/booksys/library-lab/state/bundle-inputs
    read_only: false
    bind: &bind_existing_b
      create_host_path: false
  - &vol_web_covers
    type: bind
    source: ${BOOKSYS_LOCAL_ROOT}/web-covers
    target: /data/booksys/library-lab/evidence/web-covers
    read_only: false
    bind:
      create_host_path: false
  - &vol_collector_covers
    type: bind
    source: ${BOOKSYS_LOCAL_ROOT}/collector-covers
    target: /data/booksys/state/downloads
    read_only: false
    bind:
      create_host_path: false
  - &vol_library
    type: bind
    source: ${BOOKSYS_NAS_LIBRARY_ROOT:?Select qualified managed-library mount}
    target: /data/booksys/library-lab/library
    read_only: false
    bind: &bind_existing_c
      create_host_path: false
  - &vol_cgroup
    type: bind
    source: /sys/fs/cgroup
    target: /sys/fs/cgroup
    read_only: true
    bind:
      create_host_path: false
  - &vol_attachments
    type: bind
    source: ${BOOKSYS_LOCAL_ROOT}/attachments
    target: /media/attachments
    bind:
      create_host_path: false
  - &vol_pieces
    type: bind
    source: ${BOOKSYS_LOCAL_ROOT}/pieces
    target: /media/pieces
    bind:
      create_host_path: false
  - &vol_tmp
    type: bind
    source: ${BOOKSYS_LOCAL_ROOT}/tmp
    target: /nas-tmp
    bind:
      create_host_path: false
  - &vol_nas_identity
    type: bind
    source: ${BOOKSYS_NAS_FILES_ROOT}
    target: /nas-identity
    read_only: true
    bind:
      create_host_path: false
  - &vol_pyload_scripts
    type: bind
    source: ${BOOKSYS_PYLOAD_CONFIG_ROOT}/scripts
    target: /pyload-scripts
    read_only: true
    bind:
      create_host_path: false
  - &vol_library_identity
    type: bind
    source: ${BOOKSYS_NAS_LIBRARY_EXPORT_ROOT:?Select qualified library export mount}
    target: /nas-library-identity
    read_only: true
    bind:
      create_host_path: false
services:
  postgres:
    profiles: [retained-dependencies]
    image: ${BOOKSYS_POSTGRES_IMAGE:?Select exact PostgreSQL 18.6 image}
    container_name: ${COMPOSE_PROJECT_NAME:?missing}-postgres
    user: 999:999
    group_add: ['1000']
    network_mode: none
    restart: unless-stopped
    stop_grace_period: 60s
    security_opt: *no_new_privileges
    cap_drop: *cap_drop_all
    logging: *json_logging
    # Cap each service's memory and disallow extra swap; the shared slice can impose a lower aggregate ceiling.
    mem_limit: 512m
    memswap_limit: 512m
    pids_limit: 128
    # Bound CPU use per service while preserving the separate application slice ceiling.
    cpus: '1'
    tmpfs:
    - /var/run/postgresql:rw,nosuid,nodev,noexec,size=1m,mode=0770,uid=999,gid=1000
    healthcheck:
      test:
      - CMD-SHELL
      - 'export PGPASSWORD="$$(cat /secrets/postgres-password)"; test "$$(psql -X --no-password --set=ON_ERROR_STOP=1 --username=booksys_migration --dbname=booksys --tuples-only --no-align --command="SELECT current_database()")" = booksys'
      interval: 10s
      timeout: 3s
      retries: 6
    environment:
      POSTGRES_DB: booksys
      POSTGRES_USER: booksys_migration
      POSTGRES_PASSWORD_FILE: /secrets/postgres-password
      POSTGRES_INITDB_ARGS: --auth-local=scram-sha-256 --auth-host=scram-sha-256
      PGHOST: ${BOOKSYS_POSTGRES_SOCKET_ROOT}
      PGDATA: /var/lib/postgresql/18/docker
    # The pinned entrypoint clears PGHOST for its temporary bootstrap psql.
    # Its private default socket is never mounted into another service.
    # Bound PostgreSQL backend count and SQL working memory within its container envelope.
    command: ['postgres', '-c', 'listen_addresses=', '-c', 'unix_socket_directories=/var/run/postgresql,${BOOKSYS_POSTGRES_SOCKET_ROOT}', '-c', 'unix_socket_permissions=0770', '-c', 'unix_socket_group=1000', '-c', 'max_connections=40', '-c', 'shared_buffers=128MB', '-c', 'work_mem=4MB']
    volumes:
    - type: bind
      source: ${BOOKSYS_POSTGRES_ROOT:?Select local PostgreSQL data under /data}
      target: /var/lib/postgresql
      bind:
        create_host_path: false
    - *postgres_socket
    - type: bind
      source: ${BOOKSYS_POSTGRES_PASSWORD_FILE:?Select private PostgreSQL initialization credential}
      target: /secrets/postgres-password
      read_only: true
      bind:
        create_host_path: false
  controller:
    <<: *business
    environment:
      <<: *business_env
    mem_limit: 2048m
    memswap_limit: 2048m
    cpus: '1'
    container_name: ${COMPOSE_PROJECT_NAME:?missing}-controller
    ports:
    - ${BOOKSYS_WEB_BIND_ADDRESS:?Preserve the existing web listen address}:${BOOKSYS_WEB_PORT:-8768}:8768
    command:
    - ops/library_service.py
    - --root
    - /data/booksys/library-lab
    - --credentials
    - /secrets/pyload.json
    - --independent-queues
    - --listen
    - 0.0.0.0
    - --public-host
    - ${BOOKSYS_PUBLIC_HOST:?Preserve the operator endpoint}
    - --public-origin
    - ${BOOKSYS_PUBLIC_ORIGIN:-}
    - --pyload
    - http://pyload:8000
    healthcheck:
      test:
      - CMD
      - /app/.venv/bin/python
      - -c
      - import http.client; client=http.client.HTTPConnection('127.0.0.1',8768,timeout=2); client.request('GET','/',headers={'Host':'${BOOKSYS_PUBLIC_HOST}'}); assert client.getresponse().status==200
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
  discovery:
    depends_on:
      controller:
        condition: service_healthy
    <<: *business
    volumes: &external_volumes
    - *vol_work
    - *postgres_socket
    - *postgres_app_credential
    - *vol_local_state
    - *vol_collector_state
    - *vol_stack_config
    - *vol_pyload_credentials
    - *vol_nas_downloads
    - *vol_bundle_inputs
    - *vol_web_covers
    - *vol_collector_covers
    - *vol_library
    - *vol_cgroup
    - *vol_attachments
    - *vol_pieces
    - *vol_tmp
    - *vol_nas_identity
    - *vol_pyload_scripts
    - *vol_library_identity
    - type: bind
      source: /mnt/booksys-host/comics-originals
      target: /data/booksys/comics-originals
      read_only: true
      bind:
        create_host_path: false
    environment:
      <<: *business_env
    mem_limit: 1024m
    memswap_limit: 1024m
    cpus: '1'
    container_name: ${COMPOSE_PROJECT_NAME:?missing}-discovery
    command:
    - -m
    - library.stage_worker
    - --root
    - /data/booksys/library-lab
    - --collector
    - /data/booksys/state
    - --reception
    - /data/booksys/downloads
    - --credentials
    - /secrets/pyload.json
    - --endpoint
    - http://pyload:8000
    - --byparr
    - http://byparr:8191/v1
    - --queue
    - discovery
    healthcheck:
      test:
      - CMD
      - /app/.venv/bin/python
      - -c
      - &actor_readiness >-
        import os,sys,time; from pathlib import Path;
        from library.operational_state import RuntimeObservation;
        from library.postgres import Database;
        boot=int(next(x.split()[1] for x in Path('/proc/stat').read_text().splitlines() if x.startswith('btime ')));
        started=boot+int(Path('/proc/1/stat').read_text().rsplit(')',1)[1].split()[19])/os.sysconf('SC_CLK_TCK');
        pulses=RuntimeObservation(Database.configured(Path('/data/booksys/library-lab/state'))).heartbeats();
        assert all(started <= pulses.get(r,0) <= time.time() and time.time()-pulses.get(r,0) <= 15 for r in sys.argv[1:])
      - discovery
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
  collection:
    depends_on:
      controller:
        condition: service_healthy
    <<: *business
    environment:
      <<: *business_env
    mem_limit: 512m
    memswap_limit: 512m
    cpus: '1'
    container_name: ${COMPOSE_PROJECT_NAME:?missing}-collection
    command:
    - -m
    - library.stage_worker
    - --root
    - /data/booksys/library-lab
    - --collector
    - /data/booksys/state
    - --reception
    - /data/booksys/downloads
    - --credentials
    - /secrets/pyload.json
    - --endpoint
    - http://pyload:8000
    - --byparr
    - http://byparr:8191/v1
    - --queue
    - collection
    healthcheck:
      test:
      - CMD
      - /app/.venv/bin/python
      - -c
      - *actor_readiness
      - collection
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
  intake:
    depends_on:
      controller:
        condition: service_healthy
    <<: *business
    volumes: *external_volumes
    environment:
      <<: *business_env
    mem_limit: 2048m
    memswap_limit: 2048m
    cpus: '1'
    container_name: ${COMPOSE_PROJECT_NAME:?missing}-intake
    command:
    - -m
    - library.stage_worker
    - --root
    - /data/booksys/library-lab
    - --collector
    - /data/booksys/state
    - --reception
    - /data/booksys/downloads
    - --credentials
    - /secrets/pyload.json
    - --endpoint
    - http://pyload:8000
    - --byparr
    - http://byparr:8191/v1
    - --queue
    - intake
    healthcheck:
      test:
      - CMD
      - /app/.venv/bin/python
      - -c
      - *actor_readiness
      - intake
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
  metadata:
    <<: *business
    depends_on:
      controller:
        condition: service_healthy
    mem_limit: 1024m
    memswap_limit: 1024m
    cpus: '1'
    container_name: ${COMPOSE_PROJECT_NAME:?missing}-metadata
    command: -m library.stage_worker --root /data/booksys/library-lab --collector /data/booksys/state --reception /data/booksys/downloads --credentials /secrets/pyload.json --endpoint http://pyload:8000 --byparr http://byparr:8191/v1 --queue metadata
    healthcheck:
      test: [CMD, /app/.venv/bin/python, -c, *actor_readiness, metadata]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
  copies:
    depends_on:
      controller:
        condition: service_healthy
    <<: *business
    volumes: *external_volumes
    environment:
      <<: *business_env
    mem_limit: 2048m
    memswap_limit: 2048m
    cpus: '1'
    container_name: ${COMPOSE_PROJECT_NAME:?missing}-copies
    command:
    - -m
    - library.stage_worker
    - --root
    - /data/booksys/library-lab
    - --collector
    - /data/booksys/state
    - --reception
    - /data/booksys/downloads
    - --credentials
    - /secrets/pyload.json
    - --endpoint
    - http://pyload:8000
    - --byparr
    - http://byparr:8191/v1
    - --queue
    - copies
    healthcheck:
      test:
      - CMD
      - /app/.venv/bin/python
      - -c
      - *actor_readiness
      - copies
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
  routing:
    depends_on:
      controller:
        condition: service_healthy
    <<: *business
    environment:
      <<: *business_env
    mem_limit: 512m
    memswap_limit: 512m
    cpus: '1'
    container_name: ${COMPOSE_PROJECT_NAME:?missing}-routing
    command:
    - -m
    - library.stage_worker
    - --root
    - /data/booksys/library-lab
    - --collector
    - /data/booksys/state
    - --reception
    - /data/booksys/downloads
    - --credentials
    - /secrets/pyload.json
    - --endpoint
    - http://pyload:8000
    - --byparr
    - http://byparr:8191/v1
    - --queue
    - routing
    healthcheck:
      test:
      - CMD
      - /app/.venv/bin/python
      - -c
      - *actor_readiness
      - routing
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
  byparr:
    profiles: [retained-dependencies]
    restart: unless-stopped
    stop_grace_period: 30s
    logging: *json_logging
    security_opt: *no_new_privileges
    container_name: ${BOOKSYS_PROJECT:-booksys}-byparr
    image: ${BOOKSYS_BYPARR_IMAGE:?Select retained Byparr extension}
    shm_size: 512m
    mem_limit: 1536m
    memswap_limit: 1536m
    cpus: '2'
    pids_limit: 1024
    healthcheck:
      test:
      - CMD
      - curl
      - --fail
      - --silent
      - --output
      - /dev/null
      - http://127.0.0.1:8191/health
      interval: 30s
      timeout: 10s
      retries: 6
      start_period: 20s
  pyload:
    profiles: [retained-dependencies]
    restart: unless-stopped
    stop_grace_period: 60s
    logging: *json_logging
    security_opt: *no_new_privileges
    container_name: ${BOOKSYS_PROJECT:-booksys}-pyload
    image: ${BOOKSYS_PYLOAD_IMAGE:?Select retained pyLoad extension}
    mem_limit: 1024m
    memswap_limit: 1024m
    cpus: '1'
    pids_limit: 256
    ports:
    - ${BOOKSYS_BIND_ADDRESS:-0.0.0.0}:${BOOKSYS_PYLOAD_PORT:-8000}:8000
    environment:
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      TZ: ${TZ:-Europe/Zurich}
      BOOKSYS_NFS_SOURCE: ${BOOKSYS_NFS_FILES_SOURCE}
      BOOKSYS_NFS_SENTINEL_SHA256: 4f34ea560d283a641de4daf0a32b3ceea7ef34882e90f11ef1a6214b8fb4fc40
    volumes:
    - type: bind
      source: ${BOOKSYS_PYLOAD_CONFIG_ROOT:?Select moved retained pyLoad config}
      target: /config
      read_only: false
      bind:
        create_host_path: false
    - type: bind
      source: ${BOOKSYS_NAS_FILES_ROOT}/downloads
      target: /downloads
      read_only: false
      bind:
        create_host_path: false
    - type: bind
      source: ${BOOKSYS_NAS_FILES_ROOT}
      target: /nas-identity
      read_only: true
      bind:
        create_host_path: false
    healthcheck:
      test:
      - CMD
      - curl
      - --fail
      - --silent
      - --output
      - /dev/null
      - http://127.0.0.1:8000/
      interval: 30s
      timeout: 10s
      retries: 6
      start_period: 30s
  tools:
    <<: *business
    restart: 'no'
    environment:
      <<: *business_env
    mem_limit: 512m
    memswap_limit: 512m
    cpus: '1'
    container_name: ${COMPOSE_PROJECT_NAME:?missing}-tools
    profiles:
    - tools
    command:
    - -m
    - library.cli
    - --help
# Candidate services join the exact retained dependency network.
networks:
  default:
    external: true
    name: ${BOOKSYS_NETWORK:?Select the exact retained dependency network}
