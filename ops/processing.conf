; Two fixed independent actors. Supervisor owns processes, not task policy.
[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0
loglevel=critical
pidfile=/tmp/processing.pid
childlogdir=/tmp

[program:ocr]
command=/app/.venv/bin/python -m library.stage_worker --root /data/booksys/library-lab --collector /data/booksys/state --reception /data/booksys/downloads --credentials /secrets/pyload.json --endpoint http://pyload:8000 --byparr http://byparr:8191/v1 --queue ocr
directory=/app
environment=BOOKSYS_NAS_PROBE_ROLE="ocr",BOOKSYS_NAS_CONTRACT="/config/nas-ocr.json"
autostart=true
autorestart=unexpected
exitcodes=0
startsecs=10
startretries=3
stopsignal=TERM
stopwaitsecs=25
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:metadata]
command=/app/.venv/bin/python -m library.stage_worker --root /data/booksys/library-lab --collector /data/booksys/state --reception /data/booksys/downloads --credentials /secrets/pyload.json --endpoint http://pyload:8000 --byparr http://byparr:8191/v1 --queue metadata
directory=/app
environment=BOOKSYS_NAS_PROBE_ROLE="metadata",BOOKSYS_NAS_CONTRACT="/config/nas-metadata.json"
autostart=true
autorestart=unexpected
exitcodes=0
startsecs=10
startretries=3
stopsignal=TERM
stopwaitsecs=25
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
